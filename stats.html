<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأداء — كلمة ومعنى</title><style>*{box-sizing:border-box;margin:0}body{background:#071329;color:#f5e6c8;font-family:sans-serif;padding:32px 16px;min-height:100vh}.wrap{max-width:920px;margin:0 auto}h1{color:#e9c86a;text-align:center;font-size:1.8rem}.sub{text-align:center;color:#c8dcee;opacity:.8;margin:8px 0 28px;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{background:#0d1f3d;border:1px solid #1d3557;border-radius:14px;padding:18px}.plat{display:flex;align-items:center;gap:8px;font-weight:700;color:#e9c86a;margin-bottom:14px;font-size:1.05rem}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.big{font-size:2.1rem;font-weight:800}.lbl{color:#c8dcee;opacity:.75;font-size:.8rem}.row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #1d3557;font-size:.85rem}.row:first-of-type{border-top:none}.row b{color:#fff}.stats{margin-top:10px}.pending{color:#ffb86b;font-size:.8rem}.chart-card{margin-top:18px;background:#0d1f3d;border:1px solid #1d3557;border-radius:14px;padding:18px}.chart-card h2{color:#e9c86a;font-size:1rem;margin-bottom:12px}canvas{width:100%;height:160px}.foot{text-align:center;color:#c8dcee;opacity:.55;font-size:.75rem;margin-top:24px}a{color:#c8dcee}.back{color:#e9c86a;text-decoration:none;font-size:.85rem}.yt{color:#ff5a5a}.ig{color:#e15a97}.tt{color:#69d6d6}.fb{color:#6aa4ff}.btn{display:inline-block;margin:14px auto 0;padding:10px 22px;background:#e9c86a;color:#071329;font-weight:700;border:none;border-radius:10px;font-size:.95rem;cursor:pointer;text-decoration:none}.btn:hover{background:#f5d97e}.btn:active{transform:scale(.97)}.btnwrap{text-align:center}.countdown{color:#c8dcee;opacity:.6;font-size:.75rem;margin-top:6px}</style></head><body><div class="wrap"><h1>📊 لوحة أداء «كلمة ومعنى»</h1><p class="sub">إحصائيات حسابات السوشيال ميديا — تُحدّث تلقائياً كل 30 دقيقة</p><div class="grid" id="cards"></div><div class="chart-card"><h2>📈 نمو المتابعين</h2><canvas id="chart"></canvas><p class="lbl" id="chart-note" style="margin-top:8px"></p></div><div class="btnwrap"><a class="btn" href="#" onclick="location.reload();return false;">🔄 تحديث الآن</a><p class="countdown" id="cd"></p></div><p class="foot" id="updated"></p><p class="foot"><a class="back" href="index.html">← الرئيسية</a> · <a href="tos.html">tos</a> · <a href="privacy.html">privacy</a></p></div><script>const PLATS=[{key:"youtube",name:"يوتيوب",cls:"yt",url:"https://www.youtube.com/@kalma_wa_maana"},{key:"instagram",name:"إنستجرام",cls:"ig",url:"https://www.instagram.com/kalma_wa_maana/"},{key:"tiktok",name:"تيك توك",cls:"tt",url:"https://www.tiktok.com/@kalma_wa_maana"},{key:"facebook",name:"فيسبوك",cls:"fb",url:"https://www.facebook.com/kalma.wa.maana"}];const AR=n=>(n==null?"—":Number(n).toLocaleString("ar-EG"));const METRICS=[["followers","متابع"],["videos","فيديو"],["views","مشاهدة"],["likes","إعجاب"]];fetch("data.json?ts="+Date.now()).then(r=>r.json()).then(d=>{const cards=document.getElementById("cards");for(const p of PLATS){const s=(d.platforms||{})[p.key]||{};const main=s.followers??s.subscribers??null;let rows="";for(const[k,l]of METRICS){const v=k==="followers"?(s.followers??s.subscribers):s[k];if(k==="followers"||v!=null)rows+=`<div class="row"><span>${l}</span><b>${AR(v)}</b></div>`}cards.insertAdjacentHTML("beforeend",`<div class="card"><div class="plat"><span class="dot ${p.cls}"></span><a href="${p.url}" target="_blank" style="color:inherit;text-decoration:none">${p.name}</a></div><div class="big">${AR(main)}</div><div class="lbl">متابع${s.status==="pending"?' <span class="pending">(يدوياً)</span>':''}</div><div class="stats">${rows}</div></div>`)}document.getElementById("updated").textContent="آخر تحديث للبيانات: "+(d.updated_at?new Date(d.updated_at).toLocaleString("ar-EG"):"—");const hist=(d.history||[]).slice(-60);const cv=document.getElementById("chart"),ctx=cv.getContext("2d");cv.width=cv.clientWidth*2;cv.height=320;ctx.scale(2,2);const series=hist.map(h=>({t:h.date,v:(h.youtube||0)+(h.instagram||0)+(h.tiktok||0)+(h.facebook||0)}));if(series.length>1){const W=cv.clientWidth,H=160,min=Math.min(...series.map(s=>s.v)),max=Math.max(...series.map(s=>s.v)),rng=Math.max(1,max-min);ctx.strokeStyle="#e9c86a";ctx.lineWidth=2;ctx.beginPath();series.forEach((s,i)=>{const x=i/(series.length-1)*(W-8)+4,y=H-14-(s.v-min)/rng*(H-28);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="rgba(233,200,106,.12)";ctx.lineTo(W-4,H);ctx.lineTo(4,H);ctx.closePath();ctx.fill();document.getElementById("chart-note").textContent=`${series[0].t} → ${series.at(-1).t} — الإجمالي الآن: ${AR(series.at(-1).v)}`}else{document.getElementById("chart-note").textContent="الرسم البياني هيبدأ يتعبّي مع مرور الأيام — بيسجّل لقطة يومية."}}).catch(()=>{document.getElementById("updated").textContent="تعذر تحميل البيانات"});let sec=1800;const cd=document.getElementById("cd");const tick=()=>{cd.textContent=`تحديث تلقائي بعد ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;if(sec--<=0)location.reload()};tick();setInterval(tick,1000);</script></body></html>
